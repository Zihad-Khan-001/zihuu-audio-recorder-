name: Quick Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate Native Code
        run: npx expo prebuild --platform android --clean

      - name: Bundle JS Offline
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build Fast APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --continue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zihuu-audio-recorder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
