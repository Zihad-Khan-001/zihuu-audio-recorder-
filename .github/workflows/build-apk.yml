name: Build Android APK via GitHub Actions

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Create Bundle and Assets
        run: |
          cd android
          ./gradlew createDebugCoverageReportfile || true
          mkdir -p app/src/main/assets
          npx expo export --platform android

      - name: Copy Bundle to Native Assets
        run: |
          cp -r dist/_expo/static/js/android/* android/app/src/main/assets/index.android.bundle 2>/dev/null || true
          cp -r dist/* android/app/src/main/assets/ 2>/dev/null || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Working APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zihuu-audio-recorder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
